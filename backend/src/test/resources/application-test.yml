spring:
  application:
    name: workspace-allocation-system-test
  
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: false
  
  h2:
    console:
      enabled: false

logging:
  level:
    com.smartans: DEBUG
    org.springframework.web: DEBUG